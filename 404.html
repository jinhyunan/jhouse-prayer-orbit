  <body>
    <div id="appSplash" role="img" aria-label="MYUNGSUNG CHURCH 2026 9월 특별새벽집회, 9월 1일 화요일부터 9월 5일 토요일까지, 미래를 말씀하시는 하나님, 예배 시간, 명성교회" style="position:absolute;inset:0;z-index:9999;border-radius:inherit">

      <div class="sp-dim"></div>
      <div class="sp-text">
        <img class="sp-church" src="/jhouse-prayer-orbit/assets/poster/church.svg" alt="MYUNGSUNG CHURCH 2026 9월 특별새벽집회">

      </div>
      <button id="spHold" type="button" aria-label="일시정지 또는 재생"></button>
      <button id="spSkip" type="button" aria-label="건너뛰기" autofocus></button>
      <div id="lfProg" aria-hidden="true">
        <span id="lfProgTxt">Loading</span>
        <span id="lfProgBg"><span id="lfProgBar"></span></span>
      </div>

    <div id="root" tabindex="-1"></div>
